<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab 3：UTM 活動網址</title>
<!-- Google Tag Manager：把 GTM-XXXXXXX 換成你的容器 ID -->
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-XXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
</script>
<!-- End Google Tag Manager -->
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1rem;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#fef3c7,#fce7f3)}
  main{width:100%;max-width:22rem;background:#fff;padding:2rem;border-radius:1.25rem;box-shadow:0 12px 32px #0001;text-align:center}
  h1{margin:0 0 .25rem;font-size:1.4rem}
  p{margin:0 0 1.25rem;color:#64748b}
  pre{margin:0 0 1.25rem;padding:1rem;background:#f8fafc;border-radius:.75rem;text-align:left;font-size:.85rem;white-space:pre-wrap}
  button{width:100%;padding:.9rem;border:0;border-radius:.75rem;font-size:1rem;font-weight:600;color:#fff;background:#ea580c;cursor:pointer}
  button:active{transform:scale(.97)}
</style>
</head>
<body>
<main>
  <h1>雙 11 課程優惠</h1>
  <p>你是從這個活動網址進來的：</p>
  <pre id="utm"></pre>
  <button id="cta">立即報名</button>
</main>
<script>
  const q = new URLSearchParams(location.search);
  document.querySelector('#utm').textContent = ['utm_source', 'utm_medium', 'utm_campaign']
    .map(k => k + ' = ' + (q.get(k) || '（沒有）')).join('\n');

  document.querySelector('#cta').onclick = () => {
    dataLayer.push({ event: 'generate_lead' });
    document.querySelector('#cta').textContent = '報名成功！';
  };
</script>
</body>
</html>
